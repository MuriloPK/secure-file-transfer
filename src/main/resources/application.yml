transfer:
  max-file-size: 200MB
  chunk-size: 5MB

storage:
  type: local
  path: ./storage
  git:
    # Para storage.type=git, use SSH ou o credential helper do Git.
    # Nunca coloque token/senha em remote.
    remote:
    branch: main
    max-blob-size: 100MB

work:
  path: ./work

crypto:
  secret-env: TRANSFER_SECRET

logging:
  level:
    root: INFO