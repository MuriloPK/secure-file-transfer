transfer:
  max-file-size: 200MB
  chunk-size: 5MB

storage:
  type: local
  path: ./storage
  # Para storage.type=object, use um bucket S3 ou compatível com S3.
  # O SDK resolve credenciais pela cadeia padrão (ambiente, role ou profile).
  s3:
    endpoint:
    bucket:
    region: us-east-1
    metadata-prefix: metadata
    blob-prefix: blobs
    path-style-access: true
    # Chunks acima do limiar usam upload multipart, sem carregar o chunk inteiro
    # em memória. O tamanho da parte precisa respeitar o mínimo do S3.
    multipart-threshold: 100MB
    multipart-part-size: 8MB
    # Chunks enviados antes de um manifest são descartados explicitamente
    # quando a publicação falha antes de iniciar o envio do manifest.
    # A varredura explícita remove chunks sem manifest mais antigos que este período.
    orphan-retention: 24h
  git:
    # Para storage.type=git, use SSH ou o credential helper do Git.
    # Nunca coloque token/senha em remote.
    remote:
    branch: main
    max-blob-size: 100MB
    # Use LFS para chunks maiores que max-blob-size (requer git-lfs instalado).
    large-blob-strategy: reject

work:
  path: ./work

crypto:
  secret-env: TRANSFER_SECRET

logging:
  level:
    root: INFO