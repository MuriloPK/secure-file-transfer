name: Git LFS hosted contract

on:
  workflow_dispatch:
  schedule:
    - cron: "43 4 * * 1-5"

permissions:
  contents: read

concurrency:
  group: secure-transfer-git-lfs-contract
  cancel-in-progress: false

jobs:
  git-lfs-contract:
    runs-on: ubuntu-latest
    # This protected environment is intentionally pointed at the second
    # provider's disposable repository, not at the repository hosting this code.
    environment: git-lfs-contract
    env:
      SECURE_TRANSFER_GIT_LFS_CONTRACT_TEST: "true"
      SECURE_TRANSFER_GIT_LFS_TEST_REMOTE: ${{ secrets.SECURE_TRANSFER_GIT_LFS_TEST_REMOTE }}
      SECURE_TRANSFER_GIT_LFS_TEST_PROVIDER: ${{ vars.SECURE_TRANSFER_GIT_LFS_TEST_PROVIDER || 'gitlab' }}
      # This job is the second-provider HTTPS confirmation. Do not make the
      # mode configurable here: a silent fallback to SSH would invalidate it.
      SECURE_TRANSFER_GIT_LFS_TEST_AUTH_MODE: "https"
      SECURE_TRANSFER_GIT_LFS_TEST_BRANCH: ${{ vars.SECURE_TRANSFER_GIT_LFS_TEST_BRANCH }}
      SECURE_TRANSFER_GIT_LFS_TEST_CHUNK_BYTES: ${{ vars.SECURE_TRANSFER_GIT_LFS_TEST_CHUNK_BYTES }}
      SECURE_TRANSFER_GIT_LFS_TEST_MIN_CHUNK_BYTES: ${{ vars.SECURE_TRANSFER_GIT_LFS_TEST_MIN_CHUNK_BYTES }}
      SECURE_TRANSFER_GIT_LFS_TEST_RETAIN_TRANSFER: ${{ vars.SECURE_TRANSFER_GIT_LFS_TEST_RETAIN_TRANSFER || 'false' }}
      GIT_LFS_CONTRACT_PAT_TOKEN: ${{ secrets.GIT_LFS_CONTRACT_PAT_TOKEN }}
      GIT_LFS_CONTRACT_PROJECT_ACCESS_TOKEN: ${{ secrets.GIT_LFS_CONTRACT_PROJECT_ACCESS_TOKEN }}
      GIT_LFS_CONTRACT_PROJECT_ACCESS_USERNAME: ${{ vars.GIT_LFS_CONTRACT_PROJECT_ACCESS_USERNAME }}
      GIT_TERMINAL_PROMPT: "0"
      GIT_ASKPASS: ""

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate protected contract configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SECURE_TRANSFER_GIT_LFS_TEST_REMOTE" \
            || { echo "::error::configure SECURE_TRANSFER_GIT_LFS_TEST_REMOTE as an environment secret"; exit 1; }
          test "$SECURE_TRANSFER_GIT_LFS_TEST_PROVIDER" = "gitlab" \
            || { echo "::error::this protected job is dedicated to the GitLab secondary provider"; exit 1; }
          case "$SECURE_TRANSFER_GIT_LFS_TEST_REMOTE" in
            https://gitlab.com/*) ;;
            *) echo "::error::the GitLab secondary-provider contract requires an https://gitlab.com/ remote"; exit 1 ;;
          esac
          test "$SECURE_TRANSFER_GIT_LFS_TEST_AUTH_MODE" = "https" \
            || { echo "::error::the secondary-provider contract must run in https mode"; exit 1; }
          test -n "$SECURE_TRANSFER_GIT_LFS_TEST_BRANCH" \
            || { echo "::error::configure SECURE_TRANSFER_GIT_LFS_TEST_BRANCH as an environment variable"; exit 1; }
          test -n "$SECURE_TRANSFER_GIT_LFS_TEST_CHUNK_BYTES" \
            || { echo "::error::configure SECURE_TRANSFER_GIT_LFS_TEST_CHUNK_BYTES as an environment variable"; exit 1; }
          test -n "$SECURE_TRANSFER_GIT_LFS_TEST_MIN_CHUNK_BYTES" \
            || { echo "::error::configure SECURE_TRANSFER_GIT_LFS_TEST_MIN_CHUNK_BYTES as an environment variable"; exit 1; }
          case "$SECURE_TRANSFER_GIT_LFS_TEST_CHUNK_BYTES:$SECURE_TRANSFER_GIT_LFS_TEST_MIN_CHUNK_BYTES" in
            *[!0-9:]*|*:*[!0-9]*) echo "::error::chunk and minimum sizes must be positive integers"; exit 1 ;;
          esac
          test "$SECURE_TRANSFER_GIT_LFS_TEST_CHUNK_BYTES" -gt 0 \
            || { echo "::error::chunk size must be positive"; exit 1; }
          test "$SECURE_TRANSFER_GIT_LFS_TEST_MIN_CHUNK_BYTES" -gt 0 \
            || { echo "::error::minimum chunk size must be positive"; exit 1; }
          test "$SECURE_TRANSFER_GIT_LFS_TEST_CHUNK_BYTES" -ge "$SECURE_TRANSFER_GIT_LFS_TEST_MIN_CHUNK_BYTES" \
            || { echo "::error::chunk size must be at least the configured minimum"; exit 1; }
          case "$SECURE_TRANSFER_GIT_LFS_TEST_RETAIN_TRANSFER" in
            true|false) ;;
            *) echo "::error::SECURE_TRANSFER_GIT_LFS_TEST_RETAIN_TRANSFER must be true or false"; exit 1 ;;
          esac

      - name: Configure GitLab HTTPS credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GIT_LFS_CONTRACT_PAT_TOKEN" \
            || { echo "::error::configure GIT_LFS_CONTRACT_PAT_TOKEN as an environment secret"; exit 1; }
          test -n "$GIT_LFS_CONTRACT_PROJECT_ACCESS_TOKEN" \
            || { echo "::error::configure GIT_LFS_CONTRACT_PROJECT_ACCESS_TOKEN as an environment secret"; exit 1; }
          test -n "$GIT_LFS_CONTRACT_PROJECT_ACCESS_USERNAME" \
            || { echo "::error::configure GIT_LFS_CONTRACT_PROJECT_ACCESS_USERNAME as an environment variable"; exit 1; }
          pat_token_file="$RUNNER_TEMP/git-lfs-contract-pat-token"
          project_token_file="$RUNNER_TEMP/git-lfs-contract-project-token"
          project_username_file="$RUNNER_TEMP/git-lfs-contract-project-username"
          active_profile_file="$RUNNER_TEMP/git-lfs-contract-active-profile"
          helper_file="$RUNNER_TEMP/git-lfs-contract-https-credential-helper"
          umask 077
          printf '%s' "$GIT_LFS_CONTRACT_PAT_TOKEN" > "$pat_token_file"
          printf '%s' "$GIT_LFS_CONTRACT_PROJECT_ACCESS_TOKEN" > "$project_token_file"
          printf '%s' "$GIT_LFS_CONTRACT_PROJECT_ACCESS_USERNAME" > "$project_username_file"
          cat > "$helper_file" <<'HELPER'
          #!/usr/bin/env bash
          set -euo pipefail
          active_profile_file="${RUNNER_TEMP}/git-lfs-contract-active-profile"
          case "${1:-}" in
            get)
              protocol=""
              while IFS= read -r line; do
                [[ -z "$line" ]] && break
                case "$line" in
                  protocol=*) protocol="${line#protocol=}" ;;
                esac
              done
              [[ "$protocol" == "https" ]] || exit 0
              case "$(cat "$active_profile_file")" in
                pat)
                  username="oauth2"
                  token_file="${RUNNER_TEMP}/git-lfs-contract-pat-token"
                  ;;
                project-access-token)
                  username="$(cat "${RUNNER_TEMP}/git-lfs-contract-project-username")"
                  token_file="${RUNNER_TEMP}/git-lfs-contract-project-token"
                  ;;
                *) exit 1 ;;
              esac
              printf 'username=%s\n' "$username"
              printf 'password=%s\n' "$(cat "$token_file")"
              ;;
            store|erase) exit 0 ;;
            *) exit 1 ;;
          esac
          HELPER
          chmod 700 "$helper_file"
          chmod 600 \
            "$pat_token_file" \
            "$project_token_file" \
            "$project_username_file"
          git config --global credential.helper ""
          git config --global --add credential.helper "$helper_file"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install Git LFS client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v git-lfs >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes git-lfs
          fi
          git lfs version

      - name: Run GitLab contract with PAT
        id: pat_contract
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "pat" > "$RUNNER_TEMP/git-lfs-contract-active-profile"
          ./mvnw -Dtest=GitHubTransferRepositoryAdapterTest test

      - name: Run GitLab contract with project access token
        id: project_access_token_contract
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "project-access-token" > "$RUNNER_TEMP/git-lfs-contract-active-profile"
          ./mvnw -Dtest=GitHubTransferRepositoryAdapterTest test

      - name: Record contract result and observed limits
        if: always()
        shell: bash
        env:
          PAT_CONTRACT_RESULT: ${{ steps.pat_contract.outcome }}
          PROJECT_ACCESS_TOKEN_CONTRACT_RESULT: ${{ steps.project_access_token_contract.outcome }}
        run: |
          {
            echo "## GitLab Git LFS hosted contract"
            echo ""
            echo "- Provider: \`$SECURE_TRANSFER_GIT_LFS_TEST_PROVIDER\`"
            echo "- Remote: protected environment secret (redacted)"
            echo "- Branch: \`$SECURE_TRANSFER_GIT_LFS_TEST_BRANCH\`"
            echo "- Authentication mode: \`$SECURE_TRANSFER_GIT_LFS_TEST_AUTH_MODE\`"
            echo "- PAT using Basic Auth username \`oauth2\`: \`$PAT_CONTRACT_RESULT\`"
            echo "- Project access token using GitLab-generated username (redacted): \`$PROJECT_ACCESS_TOKEN_CONTRACT_RESULT\`"
            echo "- Minimum chunk size validated: \`$SECURE_TRANSFER_GIT_LFS_TEST_MIN_CHUNK_BYTES\` bytes"
            echo "- Chunk size exercised: \`$SECURE_TRANSFER_GIT_LFS_TEST_CHUNK_BYTES\` bytes"
            echo "- Transfer retention: \`$SECURE_TRANSFER_GIT_LFS_TEST_RETAIN_TRANSFER\`"
            echo "- Stages per credential: authentication, LFS pointer publication, manifest publication, listing, download, cleanup publication (when retention=false)"
            echo "- Cleanup publication failures: fatal; the contract status is \`failure\` and logs retain the transfer UUID and exact \`transfers/<UUID>\` path (credentials redacted)"
            echo "- LFS storage: branch cleanup removes pointers; object retention is provider-specific (GitHub requires repository deletion/recreation)"
            echo "- Credentials: temporary HTTPS credential helper; both tokens and the project username are redacted"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PAT_CONTRACT_RESULT" != "success" || "$PROJECT_ACCESS_TOKEN_CONTRACT_RESULT" != "success" ]]; then
            echo "::error::one or more GitLab HTTPS credential contract executions failed"
            exit 1
          fi

      - name: Remove temporary Git credentials
        if: always()
        shell: bash
        run: |
          rm -f \
            "$RUNNER_TEMP/git-lfs-contract-https-credential-helper" \
            "$RUNNER_TEMP/git-lfs-contract-active-profile" \
            "$RUNNER_TEMP/git-lfs-contract-pat-token" \
            "$RUNNER_TEMP/git-lfs-contract-project-token" \
            "$RUNNER_TEMP/git-lfs-contract-project-username"
          git config --global --unset-all credential.helper >/dev/null 2>&1 || true
